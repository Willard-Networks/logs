version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
    assignees:
      - VottonDev
    groups:
      compatible-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: friday
    assignees:
      - VottonDev

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: friday
    assignees:
      - VottonDev

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    assignees:
      - VottonDev
