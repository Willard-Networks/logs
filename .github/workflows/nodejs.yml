name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
      - run: node --test docker/healthcheck.test.cjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      SESSION_SECRET: ci-only-not-a-production-secret
      WEBSITE_DOMAIN: localhost
      PORT: 3335
      SSL: 'false'
      DATABASE: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: ci
      MYSQL_PASS: ci
      MYSQL_DB: ci
      MYSQL_SAM_DB: ci
      ADMIN_MOD: sam
      STEAM_KEY: ci-placeholder
      ALLOWED_RANKS: admin
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build the production image
        run: |
          docker compose config --quiet
          docker compose build --pull
      - name: Start containers and check the actual image
        run: |
          docker compose up -d --wait --wait-timeout 120
          docker compose exec -T willard-logs node docker/healthcheck.cjs
          docker compose exec -T willard-logs node -e "if (process.getuid() === 0) process.exit(1)"
          docker compose exec -T willard-logs node -e "require('sqlite3')"
          docker compose exec -T redis redis-cli ping | grep -x PONG
          for service in willard-logs redis; do
            test "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$(docker compose ps -q "$service")")" = always
          done
          curl --fail http://localhost:3335/ > /dev/null
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --volumes
