networks:
  logs-network:
    driver: bridge

services:
  willard-logs:
    container_name: willard-logs
    init: true
    restart: always
    ports:
      - "${PORT:-3335}:${PORT:-3335}"
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV}
      - SESSION_SECRET=${SESSION_SECRET}
      - WEBSITE_DOMAIN=${WEBSITE_DOMAIN}
      - PORT=${PORT:-3335}
      - SSL=${SSL}
      - SSL_CERT=${SSL_CERT}
      - SSL_KEY=${SSL_KEY}
      - DATABASE=${DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASS=${MYSQL_PASS}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DB=${MYSQL_DB}
      - MYSQL_SAM_DB=${MYSQL_SAM_DB}
      - ADMIN_MOD=${ADMIN_MOD}
      - STEAM_KEY=${STEAM_KEY}
      - ALLOWED_RANKS=${ALLOWED_RANKS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    hostname: logs.willard.local
    networks:
      - logs-network
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.cjs"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    container_name: willard-logs-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - logs-network

volumes:
  redis-data:
